[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-161"
version = "0.1.0"
description = "Offline authoritative DNS zone semantic validation and delegation checks"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
dns-zone-audit = "dns_zone_audit.cli:main"
dns-zone-bootstrap = "dns_zone_audit.bootstrap_cli:main"
dns-zone-change = "dns_zone_audit.change_cli:main"
dns-zone-wildcard = "dns_zone_audit.wildcard_cli:main"
dns-zone-import = "dns_zone_audit.zone_import_cli:main"
dns-zone-cache-replay = "dns_zone_audit.cache_replay_cli:main"
dns-zone-redact = "dns_zone_audit.redact_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
